name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web UI
        run: npm run build:web

      - name: Fetch yt-dlp for this OS
        run: npm run electron:yt-dlp

      - name: Fetch Playwright Chromium
        run: npm run electron:browsers

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --publish never

      - name: Build macOS DMG
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg --publish never
        env:
          # Unsigned local/CI builds; Gatekeeper may warn until Apple notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotidraft-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
          retention-days: 14
