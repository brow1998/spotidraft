<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Spotidraft">
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2422"/>
      <stop offset="1" stop-color="#0e1413"/>
    </linearGradient>
    <linearGradient id="sd-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3cd"/>
      <stop offset="1" stop-color="#3fb59c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#sd-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#3d5450" stroke-width="1.5"/>

  <!-- Play triangle (the YouTube side) resolving into audio levels (the Spotify
       side) — left to right is the whole product in one mark. Three bars of
       uneven height read as a waveform; two even ones read as a pause button. -->
  <path d="M18 17 L18 47 L35 32 Z" fill="url(#sd-teal)"/>
  <g fill="#f5b04a">
    <rect x="38.5" y="27" width="4" height="10" rx="2"/>
    <rect x="45"   y="19" width="4" height="26" rx="2"/>
    <rect x="51.5" y="24" width="4" height="16" rx="2"/>
  </g>
</svg>
